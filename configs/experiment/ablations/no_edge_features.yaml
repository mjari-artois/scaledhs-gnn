# @package _global_

# Override defaults by taking another config
defaults:
  - ablations/base.yaml
  - _self_


model:
  policy:
    encoder:
      edge_features : False  # disable edge features in the encoder

logger:
  wandb:
    tags: ["unimp", "${env.name}", "ablations"]
    group: "${env.generator_params.num_loc}-${env.name}"
    name: "unimp-${env.generator_params.num_loc}-no-edge-features"

# @package _global_

# Override defaults by taking another config
defaults:
  - ablations/base.yaml
  - _self_


model:
  policy:
    encoder:
      init_embedding:
        _target_: ai4co_gnn.models.init.MTVRPInitEmbedding
        embed_dim: ${model.policy.embed_dim}

logger:
  wandb:
    tags: ["unimp", "${env.name}", "ablations"]
    group: "${env.generator_params.num_loc}-${env.name}"
    name: "unimp-${env.generator_params.num_loc}-no-polar"

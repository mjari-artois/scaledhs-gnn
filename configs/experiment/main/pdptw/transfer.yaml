# @package _global_

defaults:
  - /experiment/main/pdptw/from_scratch.yaml
  - _self_

model:
  transfer_from: ???     # path to MTVRP recourse ckpt; user must set
  transfer_strict: false
  train_data_size: 50_000

callbacks:
  model_checkpoint:
    every_n_epochs: 50
    filename: "epoch_{epoch:03d}"
    save_top_k: -1
    save_last: True
    monitor: "val/reward"
    mode: "max"

logger:
  wandb:
    tags: ["unimp", "pdptw", "transfer", "recourse"]
    name: "pdptw-${env.generator_params.num_loc}-transfer-${model.train_data_size}-LBtoPDPTW-metrics"

# @package _global_

defaults:
  - /model: gnn_unimp_moe.yaml
  - _self_

# Input generated by generate_data.py.
data_path: data/cvrp/test_500.npz
dataset_format: rl4co_npz
solution_output_path: logs/large_scale/cvrp_solution.json
num_customers: 500
demand_key: demand_linehaul

# Trained 50-customer checkpoint used as the local black-box solver.
checkpoint_path: logs/train/runs/50-mtvrp/unimp_moe-50-main/checkpoints/epoch_299.ckpt
checkpoint_strict: true

# Local decomposition and inference settings.
group_size: 50
num_starts: 1
device: cpu

# Set to null when the CVRP does not enforce a fixed fleet size.
max_vehicles: null

# W&B evaluation logging. The project is named after this repository.
wandb:
  enabled: true
  project: scaledhs-gnn
  name: uniform-N500-angular-group50
  group: large-scale-cvrp
  tags: [cvrp, neural-local-search, angular-decomposition]
  save_dir: logs/wandb
  offline: false

env:
  _target_: ai4co_gnn.env.mtvrp.MTVRPEnv
  name: mtvrp
  check_solution: false
  load_solutions: false
  generator_params:
    num_loc: 500
    variant_preset: cvrp

# Prevent Hydra from moving execution into an output directory, so relative
# data and checkpoint paths remain easy to use.
hydra:
  job:
    chdir: false
